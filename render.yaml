services:
  - type: web
    name: student-risk-predictor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python train.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: REQUIRE_AUTH
        value: "1"
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
