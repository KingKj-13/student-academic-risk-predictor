{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<h1>Class overview</h1>
<p id="dashboard-error" class="error" role="alert" hidden></p>
<div id="alert-banner" class="banner" hidden></div>
<div id="tiles" class="tiles"></div>

<div class="charts">
  <div class="card"><h2>Risk distribution</h2><div class="chart-box"><canvas id="risk-chart" aria-label="Students per risk category"></canvas></div></div>
  <div class="card"><h2>Averages by risk category</h2><div class="chart-box"><canvas id="average-chart" aria-label="Average attendance, internal marks and assignment score per category"></canvas></div></div>
</div>

<div class="card">
  <div class="table-tools">
    <h2>Students</h2>
    <div class="filters">
      <input id="search" type="search" placeholder="Search name or ID" aria-label="Search name or ID" maxlength="100">
      <select id="risk-filter" aria-label="Filter by risk">
        <option value="">All risk levels</option>
        <option>High</option>
        <option>Medium</option>
        <option>Low</option>
      </select>
    </div>
  </div>
  <div class="table-scroll">
    <table>
      <thead><tr><th>ID</th><th>Name</th><th>Risk</th><th>Confidence</th><th>Attendance</th><th>Internal</th><th>Assignment</th><th>Failures</th></tr></thead>
      <tbody id="students-body"></tbody>
    </table>
  </div>
  <div class="pager">
    <span id="page-info" class="muted"></span>
    <button id="prev" class="secondary" type="button">Previous</button>
    <button id="next" class="secondary" type="button">Next</button>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/vendor/chart.umd.js"></script>
<script src="/static/js/dashboard.js"></script>
{% endblock %}
